# La unica entrada publica del sistema. Detras no hay ningun puerto publicado:
# NGINX -> gateway -> los catorce servicios (ADR-025).

# El resolver de Docker: el upstream se resuelve POR PETICION, no al arrancar. Es
# lo que permite levantar el perfil `base` sin que el gateway exista todavia.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Un servidor que anuncia su version le ahorra trabajo a quien lo ataca.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 12m;

    # Vivo del propio NGINX: no toca el gateway ni la base.
    location = /nginx-vivo {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        set $arriba http://gateway:8080;
        proxy_pass $arriba;
        proxy_http_version 1.1;

        # La traza cruza la frontera con la peticion: sin esto, un error en
        # produccion no se puede seguir hasta el caso de uso que lo produjo.
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
