# Una regla que no encontro clases que revisar no es una regla violada.
#
# En la Fase 0 los catorce servicios tienen las cuatro capas vacias a proposito, y
# mas adelante habra servicios sin trabajos/ o sin adaptadores. Sin esto, ArchUnit
# falla por "no matching classes" y la unica salida practica seria @Disabled en la
# prueba de arquitectura — que es exactamente lo que no puede pasar.
#
# Lo que si sigue fallando es una capa que existe y viola la direccion.
archRule.failOnEmptyShould=false
