# tarifas — generado por scripts/nuevo_servicio.py
# Si falta una clave, el proceso NO levanta y dice cual.
spring:
  application:
    name: tarifas
  threads:
    virtual:
      enabled: true                 # ADR-015: la carga es de E/S, no reactiva
  datasource:
    url: ${BD_URL}                  # por PgBouncer, modo transaccion
    username: svc_tarifas
    password: ${BD_CLAVE}
    hikari:
      maximum-pool-size: 5     # la SUMA de los catorce no supera max_connections
      data-source-properties:
        prepareThreshold: 0         # PgBouncer en modo transaccion
  kafka:
    bootstrap-servers: ${KAFKA_URL}

aportaya:
  esquema: tarifas
  outbox:
    intervalo: PT1S                 # relevo: lee el outbox y publica DESPUES del commit
  jwt:
    jwks-uri: ${JWKS_URI}           # ADR-024: cada servicio valida la firma el mismo
  zona-horaria: America/La_Paz      # plazos habiles
  devengo:
    intentos-antes-de-incobrable: 3
    dias-para-cobrar: 30
  facturacion:
    # Datos del emisor ante el SIN. Van en configuracion porque cambian con la
    # habilitacion, no con el codigo.
    nit-emisor: ${SIN_NIT_EMISOR:1234567890}
    sucursal: 0
    punto-venta: 1
    # Lo que hay para emitir una factura despues del cierre del periodo antes de que
    # el SIN la rechace por extemporanea.
    plazo-tras-el-cierre: PT48H
  comisiones:
    # Lo que se cotiza es lo que se cobra (R-TAR-02), y una cotizacion vieja deja de
    # serlo: pasado este plazo se vuelve a cotizar contra el tarifario de hoy.
    vigencia-de-cotizacion: PT15M

management:
  endpoint:
    health:
      probes:
        enabled: true               # readiness mira base y Kafka; liveness solo el proceso
