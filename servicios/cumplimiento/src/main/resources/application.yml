# cumplimiento — generado por scripts/nuevo_servicio.py
# Si falta una clave, el proceso NO levanta y dice cual.
spring:
  application:
    name: cumplimiento
  threads:
    virtual:
      enabled: true                 # ADR-015: la carga es de E/S, no reactiva
  datasource:
    url: ${BD_URL}                  # por PgBouncer, modo transaccion
    username: svc_cumplimiento
    password: ${BD_CLAVE}
    hikari:
      maximum-pool-size: 5     # la SUMA de los catorce no supera max_connections
      data-source-properties:
        prepareThreshold: 0         # PgBouncer en modo transaccion
  kafka:
    bootstrap-servers: ${KAFKA_URL}

aportaya:
  esquema: cumplimiento
  outbox:
    intervalo: PT1S                 # relevo: lee el outbox y publica DESPUES del commit
  jwt:
    jwks-uri: ${JWKS_URI}           # ADR-024: cada servicio valida la firma el mismo
  zona-horaria: America/La_Paz      # plazos habiles
  publicacion:
    # Donde se publican archivos, expedientes y actas para que se puedan citar.
    base-url: ${BASE_URL_PUBLICA:https://aportaya.bo}
  monitoreo:
    codigo-regla-desvio: RM-DESVIO-PERFIL
  requerimientos:
    # Un oficio sin alcance descrito es una pesca: obliga a escribir que se pide.
    minimo-de-caracteres-de-alcance: 10
  reglas:
    # Tope de trafico que una regla nueva puede alcanzar antes de exigir calibracion.
    techo-de-trafico: 0.0500
  oficial:
    dias-para-comunicar: 5
    plazo-de-capacitacion: 90
  reclamos:
    # ASFI Libro 4 Titulo I: primera respuesta en cinco dias habiles.
    dias-habiles-de-respuesta: 5
    maximo-dias-de-prorroga: 10
    dias-para-elevar: 30
  continuidad:
    dias-para-regularizar: 30
  desvio:
    # Cuanto se aparta un movimiento del perfil declarado, en porcentaje, antes de
    # observarlo, investigarlo o tratarlo como caso.
    observar: 100
    investigar: 200
    caso: 500

management:
  endpoint:
    health:
      probes:
        enabled: true               # readiness mira base y Kafka; liveness solo el proceso
