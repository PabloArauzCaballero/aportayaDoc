# Contrato de cumplimiento — OpenAPI 3.1
# SE ESCRIBE PRIMERO, antes que la implementacion (ADR-020). Es lo que permite que
# otro carril genere el cliente y programe contra vos sin esperar a que termines.
#
# Prefijos reservados de este servicio: /cumplimiento, /uif, /reclamos, /licencia
#   Una ruta fuera de ellos es un rechazo automatico, no una discusion de diseno.
#   Toda ruta exige sesion: 401 sin token, 403 con rol insuficiente.
#
# Codigos de error de la ola 3. Viven aca aunque el caso de uso no tenga ruta HTTP
# propia: scripts/verificar_criterios.py los busca en este archivo.
#
# CU-40 · Evaluar limites antes de una operacion
#   AP-CU40-01  SIN_LIMITE_CONFIGURADO · sin limite para ese concepto y nivel se deniega (R-LIM-01)
#   AP-CU40-02  LIMITE_EXCEDIDO        · el acumulado mas la operacion supera el tope
#   AP-CU40-03  CANTIDAD_EXCEDIDA      · supero la cantidad maxima de operaciones de la ventana
#
# CU-41 · Detectar umbral y registrar el formulario PCC-01
#   AP-CU41-01  SIN_TIPO_DE_CAMBIO      · sin cotizacion el umbral no seria reproducible
#   AP-CU41-02  TITULAR_NO_IDENTIFICADO · operativa propia: queda exenta
#   AP-CU41-03  REGISTRO_DUPLICADO      · esa transaccion ya registro ese umbral (R-UIF-13)
#
# CU-42 · Detectar umbral y registrar ROG
#   AP-CU42-01  SIN_TIPO_DE_CAMBIO · falta cotizacion para convertir a dolares
#   AP-CU42-02  REGISTRO_DUPLICADO · ya existe el registro para esa transaccion y umbral
#
# CU-43 · Remitir los reportes mensuales a la UIF
#   AP-CU43-01  PERIODO_SIN_CERRAR     · aca: no hay catalogo activo, o el periodo no se genero
#   AP-CU43-02  SEGREGACION_INCUMPLIDA · quien aprueba no puede ser quien genero (R-SEG-04)
#   AP-CU43-03  ENVIO_FALLIDO          · el reporte ya no esta en estado GENERADO
#   AP-CU43-04  FUERA_DE_PLAZO         · se envia igual y se abre hallazgo
#
# CU-44 · De alerta de monitoreo a reporte de operacion sospechosa
#   AP-CU44-01  CONCLUSION_REQUERIDA  · no se cierra una alerta sin justificacion (R-UIF-07)
#   AP-CU44-02  REVISOR_ES_ANALISTA   · la revision tiene que ser independiente
#   AP-CU44-03  REPORTE_SIN_NARRATIVA · decidir reportar exige el ROS ya radicado
#   AP-CU44-04  CASO_VENCIDO          · se paso el plazo de investigacion
#
# CU-45 · Atender un requerimiento de autoridad
#   AP-CU45-01  OFICIO_DUPLICADO · ese numero ya fue registrado
#   AP-CU45-02  SIN_DOCUMENTO    · no se actua sin el oficio y su hash
#   AP-CU45-03  ALCANCE_AMBIGUO  · se pide aclaracion antes de entregar informacion
#   AP-CU45-04  PLAZO_VENCIDO    · se responde igual y se abre hallazgo
#
# CU-47 · Evaluar el riesgo del producto antes de lanzarlo
#   AP-CU47-01  FUERA_DE_ALCANCE        · el producto excede la licencia vigente (R-LIC-01)
#   AP-CU47-02  RIESGO_SIN_CONTROL      · hay riesgo alto sin control asociado
#   AP-CU47-03  FACTOR_FALTANTE         · falta alguno de los cuatro factores obligatorios
#   AP-CU47-04  SIN_NO_OBJECION         · el producto la exige y no la tiene (R-LIC-04)
#   AP-CU47-05  VERSION_DUPLICADA       · ya existe esa version del producto
#   AP-CU47-06  APROBADOR_NO_HABILITADO · quien aprueba no integra un comite con quorum
#
# CU-48 · Calibrar reglas de cumplimiento y triar sus alertas
#   AP-CU48-01  EXPRESION_INVALIDA      · no compila o referencia campos inexistentes
#   AP-CU48-02  UMBRAL_CABLEADO         · trae un numero en vez de apuntar al catalogo (R-UIF-01)
#   AP-CU48-03  SIMULACION_REQUERIDA    · sin simulacion previa, o supera el techo
#   AP-CU48-04  ACCION_DESPROPORCIONADA · la accion excede lo que la severidad habilita
#   AP-CU48-05  ALERTA_SIN_CONCLUSION   · cerrar sin fundamento (R-UIF-07)
#   AP-CU48-06  CODIGO_DUPLICADO        · ya existe una regla con ese codigo
#
# CU-49 · Designar al oficial de cumplimiento y capacitar
#   AP-CU49-01  TITULAR_YA_ACTIVO             · primero la baja (R-UIF-12)
#   AP-CU49-02  INCOMPATIBILIDAD_DE_FUNCIONES · roles operativos incompatibles (R-SEG-04)
#   AP-CU49-03  SIN_ACTA                      · falta el respaldo del directorio (R-LIC-03)
#   AP-CU49-04  SIN_SUPLENTE                  · baja del titular sin quien asuma
#   AP-CU49-05  COMUNICACION_VENCIDA          · reservado; el plazo viaja en el evento
#   AP-CU49-06  CAPACITACION_DUPLICADA        · reservado
#
# CU-52 · Atender un reclamo en plazo
#   AP-CU52-01  PUNTO_RECLAMO_INACTIVO · el canal elegido no esta habilitado
#   AP-CU52-02  PRORROGA_EXCEDIDA      · supera el maximo sin comunicacion al organismo (R-CON-03)
#   AP-CU52-03  FALTA_REPARACION       · favorable con monto exige devolucion (R-CON-04)
#   AP-CU52-04  PLAZO_VENCIDO          · se responde igual y escala a hallazgo
#
# CU-53 · Elevar un reclamo a segunda instancia
#   AP-CU53-01  RECLAMO_NO_RESPONDIDO  · todavia en plazo de primera instancia
#   AP-CU53-02  INSTANCIA_DUPLICADA    · ya hay una elevacion abierta en esa instancia
#   AP-CU53-03  SIN_EVIDENCIA_TECNICA  · sin rastro suficiente; es un hallazgo en si mismo
#
# CU-56 · Ejecutar una prueba de continuidad
#   AP-CU56-01  SIN_ACTA_DE_COMITE      · una prueba exitosa exige acta que la reporte
#   AP-CU56-02  OBJETIVOS_NO_ALCANZADOS · el RTO obtenido supera el comprometido
#   AP-CU56-03  PLAN_INEXISTENTE        · el proceso critico no tiene plan
#
# CU-94 · Elevar una decision al comite de gobierno
#   AP-CU94-01  SIN_QUORUM             · sesionaron menos que el minimo
#   AP-CU94-02  COMPOSICION_INCOMPLETA · falta en la mesa un rol que la composicion exige
#   AP-CU94-03  PARTE_INTERESADA       · quien tiene interes directo no vota
#   AP-CU94-04  FUERA_DE_FACULTAD      · reservado
#   AP-CU94-05  ACTA_YA_CERRADA        · reservado; lo frena la unicidad del numero
#   AP-CU94-06  COMITE_INACTIVO        · el comite no existe o no esta activo
#
# NOTA · divergencias declaradas contra la boveda, con su detalle en
# planes/informes/carril-3C.md:
#   · CU-41 crea el registro ANTES de pedir la declaracion (pasos 4 y 5). La base solo
#     admite el orden inverso: `ck_operelev_declaracion` no deja escribir un PCC-01 sin
#     origen y destino, y la tabla es append-only, asi que tampoco se completa despues.
#   · CU-47 nombra los estados EN_ELABORACION / EN_APROBACION / VIGENTE / OBSERVADA /
#     CERRADA; el catalogo admite APROBADA, BORRADOR, EN_EVALUACION y RECHAZADA.
#   · CU-48 nombra las acciones RETENER / BLOQUEAR / RECHAZAR; el catalogo admite
#     SOLO_ALERTAR, RETENER_OPERACION y BLOQUEAR_CUENTA.
openapi: 3.1.0
info:
  title: cumplimiento
  version: 1.0.0
  description: >-
    Servicio cumplimiento. Un caso de uso = una operacion, con el codigo CU en el
    operationId. Los importes viajan como CADENA decimal, nunca como number.

servers:
  - url: /api/v1

paths:
  /cumplimiento/usuarios/{usuarioId}/diligencia:
    post:
      operationId: elevarDiligencia          # CU-02
      summary: Elevar el nivel de debida diligencia
      description: >-
        Subir de nivel desbloquea topes mas altos, asi que la puerta es igual de
        dura que los topes que abre. Nunca baja: un destino que no supera al nivel
        actual se rechaza en vez de aplicarse.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: usuarioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDiligencia' }
      responses:
        '200':
          description: Diligencia elevada, u observada con lo que falta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDiligencia' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU02-01 DOCUMENTACION_INSUFICIENTE - AP-CU02-02 REQUIERE_SEGUNDA_REVISION
          # AP-CU02-03 COINCIDENCIA_PENDIENTE     - AP-CU02-04 NIVEL_NO_ASCENDENTE

  /cumplimiento/usuarios/{usuarioId}/pep:
    post:
      operationId: declararPep               # CU-03
      summary: Declaracion PEP y beneficiario final
      description: >-
        Mira tambien a los beneficiarios finales: un titular que no es PEP pero
        cuya estructura de control termina en un PEP es exactamente el caso que la
        norma quiere ver.
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaPep' }
      responses:
        '200':
          description: Declaracion registrada y cliente recalificado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaPep' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU03-01 DECLARACION_INCOMPLETA - AP-CU03-02 BENEFICIARIO_SIN_DOCUMENTO

  /cumplimiento/contratos/{contratoId}/aceptaciones:
    post:
      operationId: aceptarContrato           # CU-05
      summary: Aceptar el contrato de adhesion y el tarifario
      description: >-
        Vive aca y no en identidad —aunque la ficha del CU apunte alla— porque
        contrato_adhesion y aceptacion_contrato estan en el esquema de
        cumplimiento, y el esquema tiene precedencia sobre la ficha.
        Append-only: publicar una version nueva no toca las aceptaciones viejas.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: contratoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaAceptacion' }
      responses:
        '200':
          description: Aceptacion registrada con su evidencia sellada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAceptacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU05-01 CONTRATO_NO_VIGENTE - AP-CU05-02 VERSION_DESACTUALIZADA
          # AP-CU05-03 TARIFARIO_NO_PUBLICADO

  /cumplimiento/riesgos/eventos:
    post:
      operationId: registrarRiesgoOperativo  # CU-54
      summary: Registra un evento de riesgo operativo y su plan de accion
      description: >-
        Ponerle numero a lo que cuesta hacer las cosas mal, con las categorias y
        factores que exige la norma, y cerrar el circulo con un plan de accion con
        responsable y plazo. Una base de perdidas sin plan de accion es una coleccion
        de anecdotas caras.

        Un evento SIN perdida monetaria se registra igual, con `perdidaBruta` en cero:
        la frecuencia tambien es informacion, y filtrar las casi-perdidas por no costar
        plata deja el analisis ciego justo para lo que todavia no salio caro.

        La `perdidaNeta` que devuelve es la que calculo el MOTOR: la columna es
        GENERATED. La aplicacion no la reemplaza, la lee de vuelta (`R-RIS-02`).

        La ruta va bajo `/cumplimiento` y no bajo `/riesgos` como dice la ficha del
        caso de uso: `/riesgos` no es un prefijo reservado de este servicio, y una ruta
        fuera de los prefijos es un rechazo automatico.

        Este caso de uso vive en `cumplimiento` y no en `auditoria` —donde lo pone su
        ficha— porque las cuatro tablas que escribe estan en el esquema
        `cumplimiento`, y `svc_auditoria` no tiene GRANT sobre el. Donde la ficha y el
        modelo no coinciden, manda el modelo (invariante 11).
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRiesgoOperativo' }
      responses:
        '201':
          description: Evento registrado, con su perdida neta y su plan si lo hubo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRiesgoOperativo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU54-01 FECHAS_INCOHERENTES · AP-CU54-02 RECUPERACION_MAYOR_A_PERDIDA
          # AP-CU54-03 TAXONOMIA_INVALIDA
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /cumplimiento/seguridad/incidentes:
    post:
      operationId: registrarIncidente        # CU-55
      summary: Abre el expediente de un incidente de seguridad y arranca sus relojes
      description: >-
        Contener rapido, reportar en plazo y notificar a los titulares cuando hay datos
        personales afectados. Son TRES relojes distintos corriendo en paralelo, y los
        tres se guardan: recalcularlos al consultar los haria moverse solos, y bastaria
        cambiar la politica el mes que viene para que un incidente de hace tres meses
        apareciera reportado en plazo cuando no lo estuvo.

        Sin responsable de seguridad designado y activo NO se abre el incidente. No es
        burocracia: sin designacion no hay a quien le corran los plazos ni quien firme
        ante el organismo.

        El campo datosPersonalesAfectados es lo que DECLARA quien reporta, y lo puede
        sobrescribir el activo: si el inventario dice que ese activo contiene datos
        personales, los contiene. Quien esta apagando el incendio a las tres de la
        manana no esta en condiciones de determinar el alcance.

        El enlace con el contrato del proveedor se resuelve POR EL ACTIVO: la tabla
        incidente_seguridad no tiene columna propia para el, y agregarsela duplicaria
        un dato que ya vive en el inventario de activos.

        Vive en cumplimiento y no en auditoria, donde lo pone su ficha, porque las
        tablas que escribe estan en el esquema cumplimiento (invariante 11).
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaIncidente' }
      responses:
        '201':
          description: Incidente abierto, con sus plazos guardados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaIncidente' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU55-01 SIN_RESPONSABLE_DESIGNADO - AP-CU55-02 PLAZO_REPORTE_VENCIDO
          # AP-CU55-03 CIERRE_SIN_NOTIFICAR
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /cumplimiento/seguridad/incidentes/{incidenteId}/reportes:
    post:
      operationId: reportarIncidente         # CU-55
      summary: Deja constancia de que el incidente se reporto al organismo
      description: >-
        Se reporta IGUAL aunque el plazo haya vencido: llegar tarde es una observacion,
        no reportar es un incumplimiento. Lo que no se hace es disimularlo: el
        vencimiento queda visible y el control diario abre el hallazgo.
      parameters:
        - name: incidenteId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '204':
          description: Constancia registrada
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /cumplimiento/seguridad/incidentes/{incidenteId}/notificaciones:
    post:
      operationId: notificarTitulares        # CU-55
      summary: Deja constancia de la notificacion a los titulares afectados
      description: >-
        Se notifica con lo que se sabe, sin esperar al numero final: un aviso tardio y
        exacto le sirve menos a la persona afectada que uno a tiempo y aproximado.

        Sobre un incidente que no afecto datos personales se rechaza: asustar a gente
        sin motivo gasta la credibilidad del canal para cuando de verdad haga falta.
      parameters:
        - name: incidenteId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '204':
          description: Constancia registrada
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU55-03 CIERRE_SIN_NOTIFICAR
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /licencia/alcance:
    get:
      operationId: verificarAlcance          # CU-46
      summary: Verificar el alcance de la licencia
      description: >-
        Lo consultan los otros servicios antes de habilitar una operacion.
        Deniega por omision: sin licencia legible, sin alcance o sin sandbox, la
        respuesta es no. Un fallo de lectura no puede traducirse en «segui».
        No lleva Idempotency-Key porque no tiene efecto: solo responde.
      parameters:
        - name: servicio
          in: query
          required: true
          schema: { type: string, maxLength: 40 }
        - name: usuarioId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Decision de habilitacion, con la via y sus limites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAlcance' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU46-01 LICENCIA_NO_OTORGADA - AP-CU46-02 FUERA_DE_ALCANCE
          # AP-CU46-03 SANDBOX_AGOTADO      - AP-CU46-04 LICENCIA_SUSPENDIDA

  # CU-06 no tiene endpoint: lo dispara el planificador. Sus codigos quedan
  # declarados igual, porque el catalogo de errores es del contrato y no del
  # transporte:
  #   AP-CU06-01 SIN_CALIFICACION_VIGENTE - AP-CU06-02 PERFIL_NO_DECLARADO

components:
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Toda operacion con efecto la exige. La red duplica; reintentar tiene que ser
        seguro, y la clave se valida ANTES de escribir (invariante 7).
      schema: { type: string, format: uuid }
  schemas:
    EntradaRiesgoOperativo:
      type: object
      additionalProperties: false
      required:
        [categoriaEvento, factorRiesgo, lineaNegocio, descripcion, fechaOcurrencia,
         fechaDeteccion, perdidaBruta, moneda]
      properties:
        categoriaEvento:
          type: string
          enum: [FRAUDE_INTERNO, FRAUDE_EXTERNO, RELACIONES_LABORALES,
                 CLIENTES_PRODUCTOS_PRACTICAS, DANOS_ACTIVOS, FALLAS_SISTEMAS]
          description: >-
            Las seis de la norma. No hay «otros» a proposito: una septima categoria
            cajon se lleva todo lo incomodo y el analisis por categoria deja de decir
            nada.
        factorRiesgo:
          type: string
          enum: [PROCESOS_INTERNOS, PERSONAS, TECNOLOGIA_INFORMACION,
                 EVENTOS_EXTERNOS, INFRAESTRUCTURA]
        lineaNegocio: { type: string, maxLength: 40 }
        descripcion:  { type: string, minLength: 20 }
        fechaOcurrencia: { type: string, format: date-time }
        fechaDeteccion:
          type: string
          format: date-time
          description: >-
            Nunca anterior a la ocurrencia. Es el error de carga mas comun, y una fecha
            invertida rompe el unico indicador que de verdad importa: cuanto tardamos
            en darnos cuenta.
        perdidaBruta:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: >-
            CADENA decimal. Cero es valido: la casi-perdida se registra igual, porque la
            frecuencia tambien es informacion.
        recuperacion:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: >-
            Lo ya recuperado al registrar. La recuperacion POSTERIOR no edita el
            evento: la tabla es append-only y la perdida bruta no se toca.
        moneda: { type: string, enum: [BOB, USD] }
        responsableId:
          type: string
          format: uuid
          description: >-
            Sin responsable no hay plan de accion, y el evento se registra igual. Es
            peor perder el registro que registrar sin plan.
        accionComprometida: { type: string, maxLength: 500 }
        fechaCompromiso:    { type: string, format: date }
    SalidaRiesgoOperativo:
      type: object
      additionalProperties: false
      required: [eventoId, codigo, perdidaNeta, moneda]
      properties:
        eventoId: { type: string, format: uuid }
        codigo:
          type: string
          maxLength: 20
          description: >-
            Derivado del hecho —fecha de deteccion y categoria— para que sea legible en
            un listado y para que dos cargas del mismo hecho choquen contra el UNIQUE en
            vez de duplicar la base de perdidas.
        perdidaNeta:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          description: Bruta menos recuperacion, calculada por el motor.
        moneda: { type: string, enum: [BOB, USD] }
        planAccionId: { type: string, format: uuid }
    EntradaIncidente:
      type: object
      additionalProperties: false
      required: [tipo, severidad, datosPersonalesAfectados, usuariosAfectados, detectadoEn]
      properties:
        tipo:
          type: string
          enum: [ACCESO_NO_AUTORIZADO, DENEGACION_SERVICIO, FRAUDE_TECNOLOGICO,
                 FUGA_DE_DATOS, MALWARE, PHISHING]
        severidad: { type: string, enum: [BAJA, MEDIA, ALTA, CRITICA] }
        activoInformacionId:
          type: string
          format: uuid
          description: >-
            El activo del inventario que se vio afectado. De el salen la clasificacion
            de datos y el contrato del proveedor, si lo hay.
        datosPersonalesAfectados:
          type: boolean
          description: >-
            Lo que declara quien reporta. El activo lo puede sobrescribir: la
            clasificacion del inventario sabe mas que quien esta apagando el incendio.
        usuariosAfectados:
          type: integer
          minimum: 0
          description: >-
            Aproximado esta bien. Esperar al numero final para notificar es como se
            pierde el plazo de notificacion.
        detectadoEn:
          type: string
          format: date-time
          description: >-
            Desde aca corren los plazos, y no desde la ocurrencia: no se le puede
            exigir a nadie reportar algo que todavia no sabia.
        eventoRiesgoId:
          type: string
          format: uuid
          description: La perdida asociada, si ya se registro (CU-54).
    SalidaIncidente:
      type: object
      additionalProperties: false
      required: [incidenteId, codigo, plazoReporte, requiereNotificarTitulares, registradoEn]
      properties:
        incidenteId: { type: string, format: uuid }
        codigo:
          type: string
          maxLength: 20
          description: >-
            Derivado del hecho. Dos avisos del mismo incidente, el del monitoreo y el de
            la persona que lo vio, producen el mismo codigo y el segundo choca contra el
            UNIQUE, en vez de abrir dos expedientes con dos relojes para el mismo hecho.
        plazoReporte:
          type: string
          format: date-time
          description: >-
            Guardado, no recalculado. Es el plazo que regia el dia del incidente.
        requiereNotificarTitulares: { type: boolean }
        plazoNotificacion:
          type: string
          format: date-time
          description: Ausente cuando no hay datos personales afectados.
        contratoTerceroId:
          type: string
          format: uuid
          description: >-
            El contrato del proveedor, resuelto por el activo afectado. Presente cuando
            el incidente ocurrio en un tercero: la responsabilidad frente al cliente no
            se terceriza, pero el contrato hay que poder mirarlo.
        registradoEn: { type: string, format: date-time }
    EntradaDiligencia:
      type: object
      additionalProperties: false
      required: [nivelDestino, documentos, aprobadaPor]
      properties:
        nivelDestino: { type: string, enum: [ESTANDAR, AMPLIADA, REFORZADA] }
        documentos:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tipo, url, hash]
            properties:
              tipo: { type: string }
              url:  { type: string, format: uri }
              hash: { type: string, minLength: 64, maxLength: 64 }
        aprobadaPor:        { type: string, format: uuid }
        segundaRevisionPor: { type: string, format: uuid }
    SalidaDiligencia:
      type: object
      additionalProperties: false
      required: [diligenciaId, estado, faltantes, limitesNuevos]
      properties:
        diligenciaId: { type: string, format: uuid }
        estado:       { type: string, enum: [EN_PROCESO, COMPLETA, OBSERVADA] }
        faltantes:    { type: array, items: { type: string } }
        limitesNuevos:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [concepto, ventana]
            properties:
              concepto: { type: string }
              monto:    { type: string, pattern: '^-?\\d+\\.\\d{2}$' }
              ventana:  { type: string }
    EntradaPep:
      type: object
      additionalProperties: false
      required: [esPep]
      properties:
        esPep:   { type: boolean }
        tipoPep: { type: string, enum: [NACIONAL, EXTRANJERO, ORG_INTERNACIONAL, FAMILIAR, ALLEGADO] }
        cargo:       { type: string, maxLength: 120 }
        institucion: { type: string, maxLength: 120 }
        beneficiariosFinales:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [nombre, documento]
            properties:
              nombre:    { type: string }
              documento: { type: string }
              esPep:     { type: boolean }
              tipoPep:   { type: string, enum: [NACIONAL, EXTRANJERO, ORG_INTERNACIONAL, FAMILIAR, ALLEGADO] }
    SalidaPep:
      type: object
      additionalProperties: false
      required: [declaracionId, exigeDiligenciaReforzada, nivelRiesgo]
      properties:
        declaracionId:            { type: string, format: uuid }
        exigeDiligenciaReforzada: { type: boolean }
        nivelRiesgo:              { type: string, enum: [BAJO, MEDIO, ALTO] }
    EntradaAceptacion:
      type: object
      additionalProperties: false
      required: [usuarioId, version]
      properties:
        usuarioId:  { type: string, format: uuid }
        version:    { type: integer }
        tokenFirma: { type: string, format: uuid }
        consentimientos: { type: array, items: { type: string } }
    SalidaAceptacion:
      type: object
      additionalProperties: false
      required: [aceptacionId, hashEvidencia, aceptadoEn]
      properties:
        aceptacionId:  { type: string, format: uuid }
        hashEvidencia: { type: string, minLength: 64, maxLength: 64 }
        aceptadoEn:    { type: string, format: date-time }
    SalidaAlcance:
      type: object
      additionalProperties: false
      required: [habilitado, via]
      properties:
        habilitado: { type: boolean }
        via:        { type: string, enum: [LICENCIA, SANDBOX, NINGUNA] }
        limitesSandbox:
          type: object
          nullable: true
          additionalProperties: false
          required: [usuarios, montoOperacion]
          properties:
            usuarios:       { type: integer }
            montoOperacion: { type: string, pattern: '^-?\\d+\\.\\d{2}$' }
        motivo: { type: string, nullable: true }
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: '^-?\d+\.\d{2}$'     # CADENA: un number JSON es un doble
        moneda:
          type: string
          enum: [BOB, USD]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, trazaId]
      properties:
        codigo:   { type: string, pattern: '^AP-CU\d+-\d{2}$' }
        mensaje:  { type: string }
        detalle:  { type: object }
        trazaId:  { type: string }
  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Sin sesion valida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
