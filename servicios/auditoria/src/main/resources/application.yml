# auditoria — generado por scripts/nuevo_servicio.py
# Si falta una clave, el proceso NO levanta y dice cual.
spring:
  application:
    name: auditoria
  threads:
    virtual:
      enabled: true                 # ADR-015: la carga es de E/S, no reactiva
  datasource:
    url: ${BD_URL}                  # por PgBouncer, modo transaccion
    username: svc_auditoria
    password: ${BD_CLAVE}
    hikari:
      maximum-pool-size: 5     # la SUMA de los catorce no supera max_connections
      data-source-properties:
        prepareThreshold: 0         # PgBouncer en modo transaccion
  kafka:
    bootstrap-servers: ${KAFKA_URL}

aportaya:
  esquema: auditoria
  outbox:
    intervalo: PT1S                 # relevo: lee el outbox y publica DESPUES del commit
  jwt:
    jwks-uri: ${JWKS_URI}           # ADR-024: cada servicio valida la firma el mismo
  zona-horaria: America/La_Paz      # plazos habiles

management:
  endpoint:
    health:
      probes:
        enabled: true               # readiness mira base y Kafka; liveness solo el proceso

# Umbrales y plazos de auditoria. Estan aca y no en el codigo porque son
# decisiones de negocio: se mueven sin desplegar (invariante 10).
auditoria:
  reportes:
    # Cuanto vive un enlace de descarga. Es politica de retencion: se acorta e
    # l dia que un enlace filtrado dure demasiado.
    horas-de-vigencia: 72
    # Cuantas veces se puede bajar la misma exportacion. Mas descargas de las 
    # previstas es la senal de que el enlace se compartio.
    tope-de-descargas: 3
    # Lo que se espera a una consulta de reporte antes de cortarla. Una consul
    # ta que no termina ocupa una conexion del pool que le falta a las operaci
    # ones de dinero.
    tope-de-segundos: 30
  derechos:
    # El plazo legal para responder un derecho ARCO. Lo fija la norma, no el c
    # odigo: cuando la norma cambie, cambia aca.
    dias-habiles-de-respuesta: 15
