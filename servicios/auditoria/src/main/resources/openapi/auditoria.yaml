# Contrato de auditoria — OpenAPI 3.1
# SE ESCRIBE PRIMERO, antes que la implementacion (ADR-020). Es lo que permite que
# otro carril genere el cliente y programe contra vos sin esperar a que termines.
#
# Prefijos reservados de este servicio: /auditoria, /reportes, /indicadores
#   Una ruta fuera de ellos es un rechazo automatico, no una discusion de diseno.
#   Toda ruta exige sesion: 401 sin token, 403 con rol insuficiente.
openapi: 3.1.0
info:
  title: auditoria
  version: 1.0.0
  description: >-
    Servicio auditoria. Un caso de uso = una operacion, con el codigo CU en el
    operationId. Los importes viajan como CADENA decimal, nunca como number.

servers:
  - url: /api/v1

# Plantilla para los casos de uso que faltan de este servicio:
  # Una operacion por caso de uso. Plantilla:
  #
  #   /auditoria/…:
  #     post:
  #       operationId: <verboObjeto>          # CU-NN
  #       parameters:
  #         - name: Idempotency-Key
  #           in: header
  #           required: true                   # toda operacion con efecto
  #           schema: { type: string, format: uuid }
  #       responses:
  #         '200': …
  #         '422': { $ref: '#/components/responses/ReglaDeNegocio' }

paths:
  /indicadores:
    get:
      operationId: publicarTablero           # CU-98
      summary: Los indicadores del periodo, con su meta, su variacion y su serie
      description: >-
        [CONTRATO] Que la direccion mire siempre los mismos numeros, calculados de la
        misma forma: un indicador es una DEFINICION, no una consulta, y si dos lugares
        lo recalculan ya hay dos indicadores.

        Se lee de `auditoria.indicador_kpi`, que es donde el calculo los deja. Esta
        operacion NO calcula: publica.

        La `dimension` es la del modelo —GLOBAL, POR_GRUPO, POR_ORGANIZADOR— y no la
        que enumera el texto de CU-98. Donde el caso de uso y la tabla no coinciden,
        manda la tabla: es la que rechaza.
      parameters:
        - name: periodo
          in: query
          required: true
          description: Formato AAAA, AAAA-MM o AAAA-MM-DD, segun la granularidad
          schema: { type: string, maxLength: 10, minLength: 4 }
        - name: dimension
          in: query
          required: true
          schema: { type: string, enum: [GLOBAL, POR_GRUPO, POR_ORGANIZADOR] }
        - name: dimensionId
          in: query
          description: Obligatorio salvo en GLOBAL, donde no corresponde
          schema: { type: string, format: uuid }
        - name: periodosDeSerie
          in: query
          description: >-
            Cuantos periodos anteriores traer para el grafico. Cero trae solo el
            actual.
          schema: { type: integer, minimum: 0, maximum: 24, default: 6 }
      responses:
        '200':
          description: El tablero del periodo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaTablero' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU98-01 PERIODO_NO_CERRADO   · AP-CU98-02 SIN_DEFINICION
          # AP-CU98-03 SIN_META_DEL_PERIODO · AP-CU98-04 MUESTRA_INSUFICIENTE
          # AP-CU98-05 INDICADOR_DUPLICADO
        '401':
          $ref: '#/components/responses/NoAutenticado'

components:
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Toda operacion con efecto la exige. La red duplica; reintentar tiene que ser
        seguro, y la clave se valida ANTES de escribir (invariante 7).
      schema: { type: string, format: uuid }
  schemas:
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: '^-?\d+\.\d{2}$'     # CADENA: un number JSON es un doble
        moneda:
          type: string
          enum: [BOB, USD]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, trazaId]
      properties:
        codigo:   { type: string, pattern: '^AP-CU\d+-\d{2}$' }
        mensaje:  { type: string }
        detalle:  { type: object }
        trazaId:  { type: string }
    SalidaTablero:
      type: object
      additionalProperties: false
      required: [periodo, dimension, indicadores]
      properties:
        periodo: { type: string }
        dimension: { type: string, enum: [GLOBAL, POR_GRUPO, POR_ORGANIZADOR] }
        dimensionId: { type: string, format: uuid }
        indicadores:
          type: array
          items: { $ref: '#/components/schemas/Indicador' }
    Indicador:
      type: object
      additionalProperties: false
      required: [codigo, nombre, valor, unidad, familia, duenoFamilia, definicionVersion, calculadoEn]
      properties:
        codigo: { type: string, maxLength: 40 }
        nombre: { type: string, maxLength: 80 }
        valor:
          type: string
          description: >-
            Cadena decimal, con la escala que guardo el calculo. No se redondea al
            publicar: el numero del tablero tiene que ser el numero de la tabla.
        unidad: { type: string, maxLength: 15 }
        meta:
          type: string
          description: >-
            Ausente cuando no hay meta fijada para el periodo. Sin meta no hay
            semaforo, y ponerla despues de ver el resultado no es medir.
        cumpleMeta:
          type: boolean
          description: Ausente cuando no hay meta.
        variacionPeriodoAnterior:
          type: string
          description: >-
            Ausente en un indicador sin historia. Sin periodo anterior no hay
            comparacion, y un cero fingido afirmaria que se mantuvo igual.
        serie:
          type: array
          description: Los periodos anteriores, del mas viejo al mas nuevo.
          items:
            type: object
            additionalProperties: false
            required: [periodo, valor]
            properties:
              periodo: { type: string }
              valor: { type: string }
        familia:
          type: string
          enum: [NEGOCIO, RIESGO, CUMPLIMIENTO, OPERACION, FINANZAS]
          description: >-
            Sale del catalogo de definiciones del servicio, no de la tabla:
            `indicador_kpi` no tiene columna de familia (hueco declarado).
        duenoFamilia:
          type: string
          maxLength: 80
          description: Quien responde cuando el indicador esta en rojo.
        definicionVersion:
          type: string
          maxLength: 20
          description: >-
            Con que version de la definicion se calculo. Es lo que permite que un
            numero de hace un ano vuelva a salir igual.
        calculadoEn: { type: string, format: date-time }
  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Sin sesion valida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
