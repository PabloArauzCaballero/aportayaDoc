# Contrato de nucleo-financiero — OpenAPI 3.1
# SE ESCRIBE PRIMERO, antes que la implementacion (ADR-020). Es lo que permite que
# otro carril genere el cliente y programe contra vos sin esperar a que termines.
#
# Prefijos reservados de este servicio: /billetera /custodia /puntos-atencion /contabilidad
#   Una ruta fuera de ellos es un rechazo automatico, no una discusion de diseno.
#   Toda ruta exige sesion: 401 sin token, 403 con rol insuficiente.
#
# BORRADOR DE LA FASE 0 (planes/01 §0.8). El carril dueno lo amplia; NO puede
# romperlo sin avisar, y la prueba de contrato falla en el CI del que rompe.
#
# CU-24 · Registrar el asiento contable de una operacion — NO tiene endpoint (lo
# dispara otro caso de uso, en su misma transaccion). Sus codigos de error viven
# igual en este contrato, porque scripts/verificar_criterios.py los busca aca sin
# importar si hay una ruta HTTP que los use:
#   AP-CU24-01  ASIENTO_DESCUADRADO  · debe y haber no coinciden (R-AUD-05)
#   AP-CU24-02  CUENTA_INEXISTENTE   · el codigo de cuenta no esta en el plan
#   AP-CU24-03  PERIODO_CERRADO      · pendiente: periodo_contable es de M13 (ERP),
#                                      que todavia no existe en este carril
openapi: 3.1.0
info:
  title: nucleo-financiero
  version: 1.0.0
  description: >-
    Servicio nucleo-financiero. Un caso de uso = una operacion, con el codigo CU en el
    operationId. Los importes viajan como CADENA decimal, nunca como number.

servers:
  - url: /api/v1

paths:
  /billetera/{cuentaId}/saldo:
    get:
      operationId: consultarSaldo
      summary: Saldo de una cuenta de billetera
      description: >-
        El saldo NO se guarda: se deriva del libro. Esta operacion existe en el
        borrador porque los trece servicios necesitan saber que la forma del saldo
        es Dinero, no un number.
      parameters:
        - name: cuentaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Saldo disponible y retenido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaldoBilletera' }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/recargas:
    post:
      operationId: solicitarRecarga            # CU-10
      summary: Solicitar una recarga de saldo
      description: >-
        Crea la orden y devuelve el QR. NO acredita: el saldo se mueve cuando el
        dinero llega, no cuando la persona dice que pago. Acreditar al pedir seria
        regalarle saldo a quien abandona el pago a medias.
        AGENTE no existe (ADR-039): el unico ingreso de fondos es electronico.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRecarga' }
      responses:
        '201':
          description: Orden creada, pendiente de pago
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRecarga' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU10-01 LIMITE_EXCEDIDO           - AP-CU10-02 SALDO_MAXIMO_ALCANZADO
          # AP-CU10-03 INSTRUMENTO_NO_VERIFICADO - AP-CU10-04 CUENTA_NO_OPERATIVA
          # AP-CU10-05 ORDEN_EXPIRADA

  /billetera/retenciones:
    post:
      operationId: retenerSaldo                # CU-13
      summary: Retener saldo disponible
      description: >-
        Aparta plata que sigue siendo de la persona pero que todavia no puede usar.
        No escribe los saldos: los recalcula el trigger desde el libro. Toda
        retencion expira salvo la orden de autoridad — una sin fecha es plata ajena
        inmovilizada porque un proceso se olvido de soltarla.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRetencion' }
      responses:
        '201':
          description: Retencion vigente, con los saldos ya recalculados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRetencion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU13-01 SALDO_INSUFICIENTE - AP-CU13-02 VENCIMIENTO_REQUERIDO
          # AP-CU13-03 RETENCION_YA_EJECUTADA

  # CU-40 Evaluar limites NO tiene endpoint propio: corre DENTRO de la transaccion
  # de la operacion que evalua. Exponerlo dejaria que alguien consulte el limite,
  # vea que entra, y opere despues contra un acumulado ya cambiado.
  #   AP-CU40-01 SIN_LIMITE_CONFIGURADO - AP-CU40-02 LIMITE_EXCEDIDO
  #   AP-CU40-03 CANTIDAD_EXCEDIDA
  #
  # CU-57 Operar un punto de atencion quedo OBSOLETO con su numero reservado:
  # ADR-039 retiro el efectivo del alcance el 20-08-2026.

components:
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Toda operacion con efecto la exige. La red duplica; reintentar tiene que ser
        seguro, y la clave se valida ANTES de escribir (invariante 7).
      schema: { type: string, format: uuid }
  schemas:
    EntradaRecarga:
      type: object
      additionalProperties: false
      required: [cuentaBilleteraId, monto, medio]
      properties:
        cuentaBilleteraId: { type: string, format: uuid }
        monto:  { $ref: '#/components/schemas/Dinero' }
        medio:  { type: string, enum: [QR, TARJETA, TRANSFERENCIA] }
        instrumentoFondeoId: { type: string, format: uuid }
    SalidaRecarga:
      type: object
      additionalProperties: false
      required: [ordenRecargaId, estado]
      properties:
        ordenRecargaId: { type: string, format: uuid }
        estado:   { type: string, enum: [PENDIENTE, ACREDITADA, RECHAZADA, EXPIRADA] }
        expiraEn: { type: string, format: date-time }
        acreditara: { $ref: '#/components/schemas/Dinero' }
    EntradaRetencion:
      type: object
      additionalProperties: false
      required: [cuentaBilleteraId, monto, motivo]
      properties:
        cuentaBilleteraId: { type: string, format: uuid }
        monto:  { $ref: '#/components/schemas/Dinero' }
        motivo:
          type: string
          enum: [APORTE_PROGRAMADO, ENTREGA_EN_CURSO, DISPUTA, ORDEN_AUTORIDAD,
                 ANTIFRAUDE, COMISION_PENDIENTE]
        expiraEn: { type: string, format: date-time }
    SalidaRetencion:
      type: object
      additionalProperties: false
      required: [retencionId, saldoDisponible, saldoRetenido]
      properties:
        retencionId:     { type: string, format: uuid }
        saldoDisponible: { $ref: '#/components/schemas/Dinero' }
        saldoRetenido:   { $ref: '#/components/schemas/Dinero' }
        expiraEn:        { type: string, format: date-time, nullable: true }
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: '^-?\d+\.\d{2}$'     # CADENA: un number JSON es un doble
        moneda:
          type: string
          enum: [BOB, USD]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, trazaId]
      properties:
        codigo:   { type: string, pattern: '^AP-CU\d+-\d{2}$' }
        mensaje:  { type: string }
        detalle:  { type: object }
        trazaId:  { type: string }
    SaldoBilletera:
      type: object
      additionalProperties: false
      required: [cuentaId, disponible, retenido, alCorteDe]
      properties:
        cuentaId:   { type: string, format: uuid }
        disponible: { $ref: '#/components/schemas/Dinero' }
        retenido:   { $ref: '#/components/schemas/Dinero' }
        alCorteDe:  { type: string, format: date-time }
  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Sin sesion valida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
