# notificaciones — generado por scripts/nuevo_servicio.py
# Si falta una clave, el proceso NO levanta y dice cual.
spring:
  application:
    name: notificaciones
  threads:
    virtual:
      enabled: true                 # ADR-015: la carga es de E/S, no reactiva
  datasource:
    url: ${BD_URL}                  # por PgBouncer, modo transaccion
    username: svc_notificaciones
    password: ${BD_CLAVE}
    hikari:
      maximum-pool-size: 5     # la SUMA de los catorce no supera max_connections
      data-source-properties:
        prepareThreshold: 0         # PgBouncer en modo transaccion
  kafka:
    bootstrap-servers: ${KAFKA_URL}

aportaya:
  esquema: notificaciones
  outbox:
    intervalo: PT1S                 # relevo: lee el outbox y publica DESPUES del commit
  jwt:
    jwks-uri: ${JWKS_URI}           # ADR-024: cada servicio valida la firma el mismo
  zona-horaria: America/La_Paz      # plazos habiles
  webhook:
    # Del almacen de secretos: es lo que separa un acuse del proveedor de cualquiera
    # que alcance la ruta publica del webhook.
    secreto: ${WEBHOOK_SECRETO}
  proveedores:
    umbral-de-salud: 70
  envios:
    # Tope del retroceso exponencial entre reintentos. Sin techo, un proveedor caido
    # empuja el proximo intento a horas y el aviso llega cuando ya no sirve.
    techo-de-espera: PT60M
  ventana-de-envio:
    # Nadie recibe un aviso a las tres de la manana salvo que sea obligatorio.
    desde: "08:00"
    hasta: "21:00"

management:
  endpoint:
    health:
      probes:
        enabled: true               # readiness mira base y Kafka; liveness solo el proceso
