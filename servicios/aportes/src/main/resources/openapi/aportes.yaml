# Contrato de aportes — OpenAPI 3.1
# SE ESCRIBE PRIMERO, antes que la implementacion (ADR-020). Es lo que permite que
# otro carril genere el cliente y programe contra vos sin esperar a que termines.
#
# Prefijos reservados de este servicio: /aportes, /pagos, /qr, /conciliacion
#   Una ruta fuera de ellos es un rechazo automatico, no una discusion de diseno.
#   Toda ruta exige sesion: 401 sin token, 403 con rol insuficiente.
#
# Codigos de error de los casos de uso implementados. Viven aca aunque el caso de uso
# no tenga ruta HTTP propia: scripts/verificar_criterios.py los busca en este archivo.
#
# CU-21 · Cobrar el aporte del periodo
#   AP-CU21-01  OBLIGACION_NO_VIGENTE · la obligacion no admite pago en su estado
#   AP-CU21-02  MONTO_NO_COINCIDE     · el monto no cuadra con lo que se debe
#   AP-CU21-03  SALDO_INSUFICIENTE    · lo evalua nucleo-financiero al debitar; aportes
#                                       lo declara para que el cliente lo conozca
#   AP-CU21-04  PERIODO_CERRADO       · el periodo del grupo ya no admite cobros
#
# CU-19 · Reembolsar un pago y atender una disputa
#   AP-CU19-01  PAGO_NO_CONCILIADO    · no se devuelve lo que todavia no entro
#   AP-CU19-02  MONTO_EXCEDE_PAGO     · contra lo YA reembolsado, no contra el original
#   AP-CU19-03  APROBACION_REQUERIDA  · sin firma el reembolso no sale
#   AP-CU19-04  MISMO_SOLICITANTE     · quien aprueba no es quien solicito (R-SEG-04)
#   AP-CU19-05  PROVEEDOR_SIN_SOPORTE · aca: motivo de reembolso que la DDL no admite.
#                                       Ver el hueco declarado en planes/informes/carril-3A.md
#   AP-CU19-06  DISPUTA_DUPLICADA     · el proveedor reenvia; una disputa por pago
#
# CU-99 · Dar de alta un proveedor de pago y enrutar el cobro
#   AP-CU99-01  CODIGO_DUPLICADO      · dos proveedores con el mismo codigo parten el
#                                       historial de cobros y ninguna conciliacion cierra
#   AP-CU99-02  SIN_CONTRATO_TERCERO  · no se le manda trafico a un tercero sin contrato
#   AP-CU99-03  PRUEBAS_INCOMPLETAS   · sin pruebas de integracion no recibe trafico real
#   AP-CU99-04  SIN_COBERTURA         · ningun proveedor sano al que conmutar
#   AP-CU99-05  CREDENCIAL_EN_TABLA   · ninguna clave entra a la fila, ni disfrazada
#   AP-CU99-06  PROVEEDOR_DEGRADADO   · salud bajo el umbral: sale de la cola
openapi: 3.1.0
info:
  title: aportes
  version: 1.0.0
  description: >-
    Servicio aportes. Un caso de uso = una operacion, con el codigo CU en el
    operationId. Los importes viajan como CADENA decimal, nunca como number.

servers:
  - url: /api/v1

paths:
  /aportes/obligaciones/{obligacionId}/pagos:
    post:
      operationId: cobrarAporte                # CU-21
      summary: Acreditar el pago de una obligacion de aporte
      description: >-
        El dinero lo mueve nucleo-financiero (invariante 12): esta operacion aplica el
        pago a la obligacion y pide el movimiento por evento. La clave de idempotencia
        se valida ANTES de escribir.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: obligacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaCobro' }
      responses:
        '200':
          description: Pago acreditado, o el mismo de un reintento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCobro' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /pagos/{pagoId}/reembolsos:
    post:
      operationId: solicitarReembolso          # CU-19
      summary: Solicitar el reembolso de un pago
      description: >-
        Solo SOLICITA. Ejecutar exige una segunda persona (R-SEG-04): un reembolso es
        la via mas corta para sacar dinero con una excusa verosimil.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: pagoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaReembolso' }
      responses:
        '200':
          description: Reembolso en estado SOLICITADO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaReembolso' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /pagos/reembolsos/{reembolsoId}/aprobacion:
    post:
      operationId: aprobarReembolso            # CU-19
      summary: Aprobar y ejecutar un reembolso solicitado
      description: >-
        Quien aprueba no puede ser quien solicito. Al ejecutar, la obligacion vuelve a
        estar pendiente por ese importe: si quedara dada por pagada, el faltante lo
        absorben los demas del grupo sin enterarse.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: reembolsoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reembolso ejecutado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaEjecucionReembolso' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /pagos/{pagoId}/disputas:
    post:
      operationId: registrarDisputa            # CU-19
      summary: Registrar una disputa recibida del proveedor
      description: >-
        El plazo de respuesta se calcula al ingresar y queda GUARDADO (R-CON-01,
        invariante 8): recalcularlo al consultar es un argumento que el proveedor no
        acepta.
      parameters:
        - name: pagoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDisputa' }
      responses:
        '200':
          description: Disputa abierta, o la que ya estaba si el proveedor reenvia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDisputa' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /pagos/proveedores:
    post:
      operationId: darDeAltaProveedor          # CU-99
      summary: Dar de alta un proveedor de pago
      description: >-
        La columna referencia_credenciales guarda una REFERENCIA al almacen de
        secretos, nunca el secreto. Se comprueba antes de tocar la base: una clave que
        llega a la fila ya se filtro aunque la transaccion se revierta.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaProveedor' }
      responses:
        '201':
          description: Proveedor activo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaProveedor' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /pagos/enrutamiento:
    post:
      operationId: enrutarCobro                # CU-99
      summary: Elegir por que proveedor cobrar una orden
      description: >-
        No escribe. Al conmutar de proveedor se conserva la MISMA clave de
        idempotencia: si el primero cobro y no alcanzo a responder, cambiarla es
        exactamente como se cobra dos veces.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaEnrutamiento' }
      responses:
        '200':
          description: Proveedor elegido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaEnrutamiento' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /aportes/participantes/{participanteId}/estado:
    get:
      operationId: consultarEstadoDelParticipante
      summary: Si esta al dia, cuanto aporto y cuanto debe
      description: >-
        La consulta que hace posible que otros servicios decidan sin leer este esquema
        (invariante 11). `grupos` la usa antes de permitir una permuta o un traspaso;
        `nucleo-financiero`, antes de cerrar una billetera. Sin ella, el dato lo
        tendria que afirmar quien pide — y el que pide seria juez de si esta al dia.

        Quien no tiene ninguna obligacion esta al dia: no deber nada porque todavia no
        se le pidio nada no es estar en mora.
      parameters:
        - name: participanteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El estado de pagos del participante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoDelParticipante' }

  /aportes/grupos/{grupoId}/morosos:
    get:
      operationId: contarMorosos
      summary: Cuantos participantes del grupo estan en mora
      description: >-
        La usa CU-68 para medir la concentracion de riesgo antes de aceptar a alguien
        nuevo: un grupo con la mitad en mora no admite mas gente, la ayuda.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La cuenta de morosos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Morosos' }

components:
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Toda operacion con efecto la exige. La red duplica; reintentar tiene que ser
        seguro, y la clave se valida ANTES de escribir (invariante 7).
      schema: { type: string, format: uuid }
  schemas:
    EstadoDelParticipante:
      type: object
      additionalProperties: false
      required: [alDia, totalAportado, deudaVigente, porAportar, obligacionesAbiertas, moneda]
      properties:
        alDia: { type: boolean }
        totalAportado: { type: string, pattern: '^-?\d+\.\d{2}$' }
        deudaVigente: { type: string, pattern: '^-?\d+\.\d{2}$' }
        porAportar: { type: string, pattern: '^-?\d+\.\d{2}$' }
        obligacionesAbiertas: { type: integer }
        moneda: { type: string, enum: [BOB, USD] }
    Morosos:
      type: object
      additionalProperties: false
      required: [grupoId, morosos]
      properties:
        grupoId: { type: string, format: uuid }
        morosos: { type: integer }
    EntradaCobro:
      type: object
      additionalProperties: false
      required: [monto, canal, referenciaProveedor]
      properties:
        monto:      { $ref: '#/components/schemas/Dinero' }
        recargo:    { $ref: '#/components/schemas/Dinero' }
        canal:
          type: string
          enum: [BILLETERA_MOVIL, COMPENSACION_INTERNA, EFECTIVO_AL_ORGANIZADOR,
                 FONDO_GARANTIA, QR_INTEROPERABLE, TARJETA, TRANSFERENCIA_BANCARIA]
        referenciaProveedor: { type: string, maxLength: 100 }
        proveedorId: { type: string, format: uuid }
        esManual:    { type: boolean, default: false }
    SalidaCobro:
      type: object
      additionalProperties: false
      required: [pagoId, obligacionId, estadoObligacion, pendiente, esNuevo]
      properties:
        pagoId:           { type: string, format: uuid }
        obligacionId:     { type: string, format: uuid }
        estadoObligacion:
          type: string
          enum: [PENDIENTE, PAGADO_PARCIAL, PAGADO, EN_MORA, VENCIDO]
        pendiente:        { $ref: '#/components/schemas/Dinero' }
        esNuevo:
          type: boolean
          description: false cuando la respuesta viene de un reintento con la misma clave
    EntradaReembolso:
      type: object
      additionalProperties: false
      required: [monto, motivo]
      properties:
        monto:  { $ref: '#/components/schemas/Dinero' }
        motivo:
          type: string
          # Los cuatro que admite ck_reembolso_motivo. El CU-19 nombra otros tres que
          # la DDL no acepta: el desvio esta en planes/informes/carril-3A.md.
          enum: [DISPUTA, DUPLICADO, ERROR_MONTO, GRUPO_CANCELADO]
    SalidaReembolso:
      type: object
      additionalProperties: false
      required: [reembolsoId, estado, disponibleRestante]
      properties:
        reembolsoId:        { type: string, format: uuid }
        estado:             { type: string, enum: [SOLICITADO] }
        disponibleRestante: { $ref: '#/components/schemas/Dinero' }
    SalidaEjecucionReembolso:
      type: object
      additionalProperties: false
      required: [reembolsoId, estado, obligacionId, estadoObligacion]
      properties:
        reembolsoId:      { type: string, format: uuid }
        estado:           { type: string, enum: [EJECUTADO] }
        obligacionId:     { type: string, format: uuid }
        estadoObligacion: { type: string }
    EntradaDisputa:
      type: object
      additionalProperties: false
      required: [tipo, descripcion, montoDisputado, referenciaDelProveedor]
      properties:
        tipo:
          type: string
          enum: [CONTRACARGO, DESCONOCIMIENTO, MONTO_INCORRECTO]
        descripcion:            { type: string, maxLength: 500 }
        montoDisputado:         { $ref: '#/components/schemas/Dinero' }
        referenciaDelProveedor: { type: string, maxLength: 100 }
    SalidaDisputa:
      type: object
      additionalProperties: false
      required: [fechaLimiteRespuesta, esNueva]
      properties:
        disputaId:
          type: [string, 'null']
          format: uuid
          description: null cuando el proveedor reenvio una disputa ya abierta
        fechaLimiteRespuesta: { type: string, format: date-time }
        esNueva:              { type: boolean }
    EntradaProveedor:
      type: object
      additionalProperties: false
      required: [codigo, nombre, tipo, urlBase, referenciaCredenciales, comisionFija,
                 comisionPorcentual, prioridad, tieneContratoVigente, pruebasCompletas]
      properties:
        codigo:  { type: string, maxLength: 30 }
        nombre:  { type: string, maxLength: 120 }
        tipo:    { type: string, enum: [BANCO, BILLETERA, PASARELA] }
        urlBase: { type: string, format: uri }
        referenciaCredenciales:
          type: string
          description: >-
            REFERENCIA al almacen de secretos (vault://...). Enviar la credencial en
            claro se rechaza con AP-CU99-05 antes de tocar la base.
        comisionFija:       { type: string, pattern: '^\d+\.\d{2}$' }
        comisionPorcentual: { type: string, pattern: '^\d+\.\d{4}$' }
        soportaWebhook:      { type: boolean, default: false }
        soportaConsultaEstado: { type: boolean, default: false }
        prioridad:           { type: integer, minimum: 1, maximum: 999 }
        tieneContratoVigente: { type: boolean }
        pruebasCompletas:     { type: boolean }
    SalidaProveedor:
      type: object
      additionalProperties: false
      required: [proveedorId, codigo, activo]
      properties:
        proveedorId: { type: string, format: uuid }
        codigo:      { type: string }
        activo:      { type: boolean }
    EntradaEnrutamiento:
      type: object
      additionalProperties: false
      required: [claveIdempotencia]
      properties:
        claveIdempotencia: { type: string }
        yaIntentados:
          type: array
          items: { type: string }
          default: []
        saludObservada:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          description: >-
            Salud por codigo de proveedor, de quien la mide. No hay tabla de salud en
            aportes; un proveedor sin medicion se trata como sano porque acaba de
            pasar contrato y pruebas. Hueco declarado en planes/informes/carril-3A.md.
    SalidaEnrutamiento:
      type: object
      additionalProperties: false
      required: [proveedorId, proveedorCodigo, claveIdempotencia, estadoAnteTimeout, puedeConsultarEstado]
      properties:
        proveedorId:     { type: string, format: uuid }
        proveedorCodigo: { type: string }
        claveIdempotencia:
          type: string
          description: la MISMA que llego; conmutar de proveedor no la cambia
        estadoAnteTimeout:
          type: string
          enum: [REINTENTABLE, EN_VERIFICACION]
        puedeConsultarEstado: { type: boolean }
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: '^-?\d+\.\d{2}$'     # CADENA: un number JSON es un doble
        moneda:
          type: string
          enum: [BOB, USD]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, trazaId]
      properties:
        codigo:   { type: string, pattern: '^AP-CU\d+-\d{2}$' }
        mensaje:  { type: string }
        detalle:  { type: object }
        trazaId:  { type: string }
  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
