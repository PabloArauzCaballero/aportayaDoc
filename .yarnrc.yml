# Expo y Metro resuelven modulos recorriendo `node_modules` hacia arriba: con el
# almacen Plug'n'Play de yarn 4 no hay arbol que recorrer y el empaquetador no
# encuentra nada. `node-modules` no es preferencia, es lo que hace que la app
# arranque.
nodeLinker: node-modules

# Un paquete que no declara su dependencia y funciona porque otro la trajo es una
# rotura esperando el proximo `install`. Se declara.
enableTransparentWorkspaces: false
